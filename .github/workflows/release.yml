name: Release

on:
  push:
    tags:
      - 'v*.*.*'          # triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: write          # needed to create GitHub Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore FatimaTTSFish/FatimaTTSFish.csproj

      - name: Build (sanity check before tagging a release)
        run: dotnet build FatimaTTSFish/FatimaTTSFish.csproj -c Release --no-restore

      # No portable .exe is published — the MSI installer (built locally via
      # installer/build-installer.ps1, since installer/ is gitignored) is
      # the only supported distribution and is uploaded to this release by hand.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Fatima TTS (Fish) ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
